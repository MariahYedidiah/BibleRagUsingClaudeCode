[project]
name = "bible-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Susmita", email = "susmita.roy@hyperbots.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arxiv>=4.0.1",
    "bs4>=0.0.2",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "huggingface-hub",
    "ipykernel>=7.4.0",
    "langchain>=1.4.4",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langserve>=0.3.3",
    "lxml>=6.1.3",
    "mcp>=1.30.0",
    "ollama",
    "pandas>=3.0.6",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "pymupdf>=1.28.2",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "sentencepiece",
    "sse-starlette>=3.5.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers",
    "uvicorn>=0.54.0",
    "wikipedia>=1.4.0",
]

[project.scripts]
bible-rag = "bible_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pyright]
# Keep the editor's language server out of data, model cache and venv; it used ~5 GB of RAM.
exclude = ["data", ".cache", ".venv", "**/__pycache__"]
useLibraryCodeForTypes = false

[tool.pytest.ini_options]
testpaths = ["tests"]  # root-level test_translation.py is a manual script that loads MT models
